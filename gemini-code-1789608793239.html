<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <!-- 모바일 기기에서 화면 비율을 맞추기 위한 필수 태그 -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>저희 결혼합니다</title>
    <style>
        /* 기본 스타일 초기화 및 폰트 설정 */
        body {
            margin: 0;
            padding: 0;
            font-family: 'Pretendard', 'Noto Sans KR', 'Apple SD Gothic Neo', sans-serif;
            background-color: #f4f4f4; /* PC에서 배경과 구분되도록 약간 회색 */
            color: #333;
        }

        /* 모바일 화면 크기에 맞춘 컨테이너 */
        .mobile-container {
            max-width: 430px; /* 일반적인 스마트폰 최대 너비 */
            margin: 0 auto; /* 화면 중앙 정렬 */
            background-color: #ffffff;
            min-height: 100vh;
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.05); /* 약간의 그림자 효과 */
            overflow-x: hidden;
        }

        /* 각 섹션(메인, 인사말, 갤러리 등)의 기본 간격 */
        section {
            padding: 60px 20px;
            text-align: center;
        }

        /* 임시 메인 커버 스타일 */
        .main-cover {
            background-color: #faf5f0; /* 따뜻한 베이지톤 */
            padding: 100px 20px;
        }
        
        .main-title {
            font-size: 24px;
            font-weight: 300;
            margin-bottom: 10px;
        }
        
        .main-date {
            font-size: 16px;
            color: #777;
            letter-spacing: 2px;
        }
    </style>
</head>
<body>

    <div class="mobile-container">
        
        <!-- 1. 메인 커버 섹션 -->
        <section class="main-cover" id="cover">
            <h1 class="main-title">신랑이름 & 신부이름</h1>
            <p class="main-date">2026. 10. 24. SAT PM 12:30</p>
            <!-- 향후 여기에 메인 웨딩 사진이 들어갈 자리입니다 -->
        </section>

        <!-- 2. 초대 인사말 섹션 -->
        <section class="greeting" id="greeting">
            <h2>초대합니다</h2>
            <p>서로를 마주 보며 다져온 사랑을<br>이제 함께 한 곳을 바라보며 걸어가려 합니다.<br><br>저희 두 사람이 사랑의 이름으로<br>지켜나갈 수 있도록 앞날을 축복해 주시면<br>감사하겠습니다.</p>
        </section>

        <!-- 3. 사진 갤러리 섹션 (추후 스와이프 기능 구현) -->
        <section class="gallery" id="gallery">
            <h2>Gallery</h2>
            <p>아름다운 순간들</p>
        </section>

        <!-- 4. 오시는 길 섹션 (추후 지도 API 연동) -->
        <section class="location" id="location">
            <h2>오시는 길</h2>
            <p>웨딩홀 이름 및 주소</p>
        </section>

        <!-- 5. 마음 전하실 곳 (추후 계좌번호 복사 기능 구현) -->
        <section class="account" id="account">
            <h2>마음 전하실 곳</h2>
            <p>축의금 계좌 안내</p>
        </section>

    </div>

</body>
</html>
